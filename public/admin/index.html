<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager | Ignite</title>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  <script>
    // Ensure the CMS knows exactly where the config is
    window.CMS_CONFIG = {
      config: {
        backend: {
          name: 'github',
          repo: 'alazem/Ignite',
          branch: 'main',
          base_url: 'https://ignitetechnologies.vercel.app',
          auth_endpoint: 'api/auth'
        }
      }
    };
  </script>
</body>
</html>
